name: 24/7 Autonomous Central Brain & SEO Engine

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-autonomous-brains:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Execute Central Brain & Task Dispatcher
        run: |
          python run_central_brain.py

      - name: Execute 12-Module SEO Intelligence Pipeline
        run: |
          python run_seo_pipeline.py --mode manual

      - name: Execute Master Brain Agents
        run: |
          python -c "
          from core.master_brain.main import process_command
          process_command('Find publisher websites')
          process_command('publisher outreach')
          process_command('Find client leads')
          "

      - name: Commit & Push Intelligence Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): 24/7 autonomous intelligence run update" && git push)
